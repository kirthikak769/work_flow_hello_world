name: CI Pipeline

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository code
        uses: actions/checkout@v3

      - name: Confirm execution and print branch
        run: |
          echo "CI pipeline executed successfully."
          echo "Target branch reference: ${{ github.ref }}"
